# Copy into the PRIVATE application's .github/workflows/flora-build.yml.
# Replace FLORA_COMMIT_SHA with a reviewed 40-character commit SHA from
# uulab-official/flora. Never use an unpinned branch for signing.
name: Flora native build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        options: [android, ios]
      profile:
        description: Build profile
        type: choice
        required: true
        options: [preview, production]
permissions:
  contents: read
jobs:
  native:
    # Runner and billing are scoped to THIS PRIVATE calling repository.
    uses: uulab-official/flora/.github/workflows/reusable-expo-build.yml@FLORA_COMMIT_SHA
    with:
      platform: ${{ inputs.platform }}
      profile: ${{ inputs.profile }}
      project-directory: .
      install-directory: .
      node-version: '24.19.0'
    secrets:
      FLORA_IOS_P12_BASE64: ${{ secrets.FLORA_IOS_P12_BASE64 }}
      FLORA_IOS_P12_PASSWORD: ${{ secrets.FLORA_IOS_P12_PASSWORD }}
      FLORA_IOS_PROFILE_BASE64: ${{ secrets.FLORA_IOS_PROFILE_BASE64 }}
      FLORA_IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.FLORA_IOS_EXPORT_OPTIONS_BASE64 }}
