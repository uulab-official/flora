name: Foundation checks
# Avoid running the same expensive OS matrix twice on every feature-branch
# push. Main pushes and pull requests remain fully tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: node --version
      - name: Pin npm beside the selected Node on every OS
        run: >-
          node --input-type=module -e
          "import { execFileSync } from 'node:child_process';
          import { dirname } from 'node:path';
          import { resolveNpmCLI } from './scripts/pack-ota-sdk.mjs';
          const prefix = process.platform === 'win32' ? dirname(process.execPath) : dirname(dirname(process.execPath));
          execFileSync(process.execPath, [await resolveNpmCLI(), 'install', '--global', 'npm@10.9.8', '--ignore-scripts', '--prefix', prefix], { stdio: 'inherit' });"
      - run: npm --version
      - run: git --version
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm --version
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm check
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm platform --help
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm flora dogfood --help
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm platform doctor --json
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm platform config validate --file examples/local-workflow.json
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm platform job simulate --file examples/local-workflow.json --scenario happy-path
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm platform job simulate --file examples/local-workflow.json --scenario runner-replacement
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm platform job simulate --file examples/local-workflow.json --scenario unsafe-expiry
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm doctor:toolchain
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm verify:clean
      - run: git diff --exit-code
