name: Foundation checks
# Avoid running the same expensive OS matrix twice on every feature-branch
# push. Main pushes and pull requests remain fully tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: node --version
      - name: Pin npm beside the selected Node on every OS
        run: >-
          node --input-type=module -e
          "import { execFileSync } from 'node:child_process';
          import { dirname } from 'node:path';
          import { resolveNpmCLI } from './scripts/pack-ota-sdk.mjs';
          const prefix = process.platform === 'win32' ? dirname(process.execPath) : dirname(dirname(process.execPath));
          execFileSync(process.execPath, [await resolveNpmCLI(), 'install', '--global', 'npm@10.9.8', '--ignore-scripts', '--prefix', prefix], { stdio: 'inherit' });"
      - run: npm --version
      - run: git --version
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm --version
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Full suite on Linux and macOS
        if: runner.os != 'Windows'
        run: npm exec --yes --package=pnpm@11.19.0 -- pnpm check
      - name: Windows compile, types and portable provider API tests
        # The native security sandbox is macOS-only. Existing Unix filesystem/
        # native runner tests are not Windows-compatible. Do NOT imply that
        # those untested features are Windows-ready.
        if: runner.os == 'Windows'
        run: |
          npm exec --yes --package=pnpm@11.19.0 -- pnpm build
          npm exec --yes --package=pnpm@11.19.0 -- pnpm typecheck
          node scripts/test.mjs packages/core/test/identity.test.ts tests/reusable-expo-build.test.ts tests/integration-providers.test.ts tests/remote-providers.test.ts tests/eas-build-provider.test.ts
      # Invoke the compiled CLI directly: pnpm/npm shims on Windows swallow
      # argument flags such as --file and --scenario.
      - run: node packages/cli/dist/main.js --help
      - run: node packages/cli/dist/main.js dogfood --help
      - run: node packages/cli/dist/main.js doctor --json
      - run: node packages/cli/dist/main.js config validate --file examples/local-workflow.json
      - run: node packages/cli/dist/main.js job simulate --file examples/local-workflow.json --scenario happy-path
      - run: node packages/cli/dist/main.js job simulate --file examples/local-workflow.json --scenario runner-replacement
      - run: node packages/cli/dist/main.js job simulate --file examples/local-workflow.json --scenario unsafe-expiry
      - run: npm exec --yes --package=pnpm@11.19.0 -- pnpm doctor:toolchain
      - name: Verify clean source isolation (Linux/macOS only)
        if: runner.os != 'Windows'
        run: npm exec --yes --package=pnpm@11.19.0 -- pnpm verify:clean
      - run: git diff --exit-code
