name: Flora isolated OTA runner
on:
  workflow_call:
    inputs:
      app-id:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  export-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch immutable trusted controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: uulab-official/flora
          ref: 6a1446e8a3df6f53ce3fe5278ce1b1d12f2ebbf0
          persist-credentials: false
          sparse-checkout: ci/flora-runner
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Verify trusted runtime
        run: |
          cd ci/flora-runner
          sha256sum --check SHA256SUMS
          node --test github-runner-bootstrap.test.mjs
      - name: Export admitted commit and publish its app-scoped OTA
        env:
          FLORA_APP_ID: ${{ inputs.app-id }}
        run: node ci/flora-runner/github-runner-bootstrap.mjs
