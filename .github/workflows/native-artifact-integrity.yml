name: Native artifact integrity gate

on:
  pull_request:
    paths:
      - "scripts/artifacts/**"
      - "package.json"
      - ".github/workflows/native-artifact-integrity.yml"
  push:
    branches:
      - main
      - "verify/flora-hosted-*"
      - "feat/local-build-console-*"
    paths:
      - "scripts/artifacts/**"
      - "package.json"
      - ".github/workflows/native-artifact-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Test local build operations without cloud credentials
        run: node scripts/artifacts/run-tests.mjs
